<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Andrew Nguyen">
    <title>Loot Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Loot Tracker</h1>

        <form id="lootForm" novalidate>
            <div class="field">
                <label for="lootName">Loot name</label>
                <input type="text" id="lootName" name="lootName" aria-describedby="message">
            </div>

            <div class="field">
                <label for="lootValue">Loot Value</label>
                <input type="number" id="lootValue" name="lootValue" step="any" aria-describedby="message">
            </div>

            <button type="submit" id="addLootButton">Add Loot</button>
        </form>

        <p id="message" class="message" role="alert"></p>

        <section>
            <h2>Loot Collected</h2>
            <ul id="lootList">
                <li class="empty">No loot added yet.</li>
            </ul>
        </section>

        <section>
            <h2>Total</h2>
            <p class="total">Total Loot Value: <span id="totalDisplay">0</span></p>
        </section>
    </main>

    <script src="js/node.js"></script>
</body>
</html>
